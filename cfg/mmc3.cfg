# Configuration ld65 - Projet SPATIAL - MMC3 (TKROM : PRG-RAM sauvegardee par pile)
# PRG-ROM 256 Kio (32 bancs de 8 Kio), CHR-ROM 32 Kio.
# Mode PRG MMC3 0 : $8000 = R6 (commutable), $A000 = R7 (commutable),
#                   $C000 = banc 30 (fixe), $E000 = banc 31 (fixe).
# Bancs : 0 = secteur 1, 1 = musique ($A000), 2-4 = secteurs 2-4,
#         5 = interface (ecran titre, sequences narratives), 6-7 = secteurs 5-6,
#         8-29 = libres.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    SRAM:   start = $6000, size = $2000, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG8:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG9:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG10:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG11:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG12:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG13:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG14:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG15:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG16:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG17:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
