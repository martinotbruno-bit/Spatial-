# Configuration ld65 - Projet SPATIAL - MMC3 (TKROM : PRG-RAM sauvegardee par pile)
# Prototype Phase 1 : PRG-ROM 64 Kio (8 bancs de 8 Kio), CHR-ROM 32 Kio.
# Mode PRG MMC3 0 : $8000 = R6 (commutable), $A000 = R7 (commutable),
#                   $C000 = avant-dernier banc (fixe), $E000 = dernier banc (fixe).
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    SRAM:   start = $6000, size = $2000, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7:   start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HEADER:   load = HDR,  type = ro;
    DATA0:    load = PRG0, type = ro;
    DATA1:    load = PRG1, type = ro;
    DPCM:     load = PRG6, type = ro, align = 64;
    CODE:     load = PRG6, type = ro;
    CODE7:    load = PRG7, type = ro;
    RODATA:   load = PRG7, type = ro;
    VECTORS:  load = PRG7, type = ro, start = $FFFA;
    CHARS:    load = CHR,  type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, define = yes;
    SAVE:     load = SRAM, type = bss, define = yes;
}
