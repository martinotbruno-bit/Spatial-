    PRG31:  start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HEADER:   load = HDR,   type = ro;
    DATA0:    load = PRG0,  type = ro;
    DATA1:    load = PRG1,  type = ro;
    SEC2:     load = PRG2,  type = ro;
    SEC3:     load = PRG3,  type = ro;
    SEC4:     load = PRG4,  type = ro;
    SEC6:     load = PRG6,  type = ro;
    SEC7:     load = PRG7,  type = ro;
    UI:       load = PRG5,  type = ro;
    DPCM:     load = PRG30, type = ro, align = 64;
    CODE:     load = PRG30, type = ro;
    CODE7:    load = PRG31, type = ro;
    RODATA:   load = PRG31, type = ro;
    VECTORS:  load = PRG31, type = ro, start = $FFFA;
    CHARS:    load = CHR,   type = ro;
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = RAM,   type = bss, define = yes;
    SAVE:     load = SRAM,  type = bss, define = yes;
}
